<script>
(() => {
const SW = 1024, SH = 768;
const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const RED = '#e8312f', GREEN = '#2fa31f';
const PREV = 'newton-first-law-car-turn.html', NEXT = 'newton-second-law.html', LAST_BUILD = 2;

// ---------- Scene geometry (stage px) ----------
const VIEW = {x: 470, y: 200, w: 544, h: 462};          // framed picture area (like the photo on the slide)
const CAR_W = 340, ROOF = 272, CEIL = 292, FLOOR = 560, UNDER = 596, RAIL = 622;
const CAR0 = 500;                                       // car's back end at rest
const WALL = 10;                                        // end-wall thickness
const YOU0 = 150;                                       // your position in the car (from its back end)
const HALF = 22;                                        // half-width of you (dress hem)
const STRAPS = [95, 172, 250];                          // strap pivots along the overhead bar (car coords)
const HELD = 1;                                         // index of the strap you hold
const ACC = 28;                                         // car's acceleration, px/s^2 (constant)
const GAP = YOU0 - HALF - WALL;                         // distance from your back to the back wall
const T_END = Math.sqrt(2 * GAP / ACC);                 // time for the back wall to reach you (no forces)

// ---------- State ----------
let build = 0, t = 0, running = false, paused = false;

function enter(b) {
  build = Math.max(0, Math.min(LAST_BUILD, b));
  t = 0; paused = false; running = build > 0;
  reveal();
}
function step(dt) {
  if (!running || paused) return;
  t = Math.min(T_END, t + dt);
  if (t >= T_END) { running = false; reveal(); }
}
function reveal() {
  const done = !running && t >= T_END;
  const showX = build >= 2 || (build === 1 && done);
  const showC = build === 2 && done;
  for (const id of ['gx', 'qx']) document.getElementById(id).classList.toggle('hide', !showX);
  for (const id of ['gc', 'qc']) document.getElementById(id).classList.toggle('hide', !showC);
}

// ---------- Drawing ----------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let scale = 1;
function layout() {
  const W = innerWidth, H = innerHeight;
  scale = Math.min(W / SW, H / SH);
  const st = document.getElementById('stage');
  st.style.transform = `scale(${scale})`;
  st.style.left = (W - SW * scale) / 2 + 'px';
  st.style.top = (H - SH * scale) / 2 + 'px';
  const dpr = devicePixelRatio || 1;
  cv.width = Math.round(SW * scale * dpr); cv.height = Math.round(SH * scale * dpr);
}

function arrow(x1, y1, x2, y2, color, lw, dashed) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  if (L < 6) return;
  const ux = dx / L, uy = dy / L, h = Math.max(10, lw * 3.2);
  g.save(); g.strokeStyle = g.fillStyle = color; g.lineWidth = lw; g.lineCap = 'butt';
  if (dashed) g.setLineDash([lw * 2.2, lw * 1.6]);
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2 - ux * h * 0.9, y2 - uy * h * 0.9); g.stroke();
  g.setLineDash([]);
  g.beginPath(); g.moveTo(x2, y2);
  g.lineTo(x2 - ux * h - uy * h * 0.6, y2 - uy * h + ux * h * 0.6);
  g.lineTo(x2 - ux * h + uy * h * 0.6, y2 - uy * h - ux * h * 0.6);
  g.closePath(); g.fill(); g.restore();
}
// text block; (x,y) = anchor, ax/ay in {-1,0,1}: which side of the anchor the text sits on
function label(text, x, y, color, size, ax, ay, alpha, font) {
  g.save(); g.globalAlpha = alpha == null ? 1 : alpha;
  g.font = font || `${size}px ${FONT}`; g.fillStyle = color; g.textBaseline = 'middle';
  const lines = text.split('\n'), lh = size * 1.15;
  const w = Math.max(...lines.map(l => g.measureText(l).width)), h = lines.length * lh;
  let cx = x + ax * w / 2, cy = y + ay * h / 2;
  cx = Math.min(SW - 10 - w / 2, Math.max(10 + w / 2, cx));
  g.textAlign = 'left'; g.lineJoin = 'round'; g.strokeStyle = '#fff'; g.lineWidth = 7;
  lines.forEach((l, i) => g.strokeText(l, cx - w / 2, cy - h / 2 + lh * (i + 0.5)));
  lines.forEach((l, i) => g.fillText(l, cx - w / 2, cy - h / 2 + lh * (i + 0.5)));
  g.restore();
  return {cx, cy, w, h};
}

// Station seen behind the car: pale wall with pillars fixed to the ground
const PILLARS = []; for (let x = VIEW.x + 20; x < VIEW.x + VIEW.w; x += 92) PILLARS.push(x);
function drawStation(clipRects) {
  g.save();
  if (clipRects) { g.beginPath(); clipRects.forEach(r => g.rect(...r)); g.clip(); }
  g.fillStyle = '#eef0f3'; g.fillRect(VIEW.x, VIEW.y, VIEW.w, RAIL - VIEW.y);
  g.strokeStyle = '#dde1e6'; g.lineWidth = 1;                    // wall tiles
  for (let y = VIEW.y + 18; y < RAIL; y += 22) { g.beginPath(); g.moveTo(VIEW.x, y); g.lineTo(VIEW.x + VIEW.w, y); g.stroke(); }
  for (const x of PILLARS) {
    g.fillStyle = '#8f99a5'; g.fillRect(x - 13, VIEW.y, 26, RAIL - VIEW.y);
    g.fillStyle = '#b4bcc6'; g.fillRect(x - 13, VIEW.y, 7, RAIL - VIEW.y);
  }
  g.restore();
}
function drawGround() {
  g.fillStyle = '#cfc9bf'; g.fillRect(VIEW.x, RAIL, VIEW.w, VIEW.y + VIEW.h - RAIL);
  g.fillStyle = '#6f6357';
  for (let x = VIEW.x + 4; x < VIEW.x + VIEW.w; x += 34) g.fillRect(x, RAIL + 2, 18, 8);
  g.fillStyle = '#555'; g.fillRect(VIEW.x, RAIL - 3, VIEW.w, 5);
}

function drawStrap(px, tiltDeg, hand) {         // px = pivot x on the bar; hand = {x,y} if held
  const py = CEIL + 14;
  g.save();
  g.fillStyle = '#ddd'; g.strokeStyle = '#777'; g.lineWidth = 1.5;
  g.fillRect(px - 7, py - 6, 14, 12); g.strokeRect(px - 7, py - 6, 14, 12);
  let hx, hy;
  if (hand) { hx = hand.x; hy = hand.y; }
  else { const a = tiltDeg * Math.PI / 180, L = 48; hx = px - Math.sin(a) * L; hy = py + Math.cos(a) * L; }
  g.strokeStyle = '#9a9a9a'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(px, py + 5); g.lineTo(hx, hy - 10); g.stroke();
  g.strokeStyle = '#c0262d'; g.lineWidth = 5; g.lineJoin = 'round';
  const ang = Math.atan2(hx - px, hy - py);
  g.translate(hx, hy); g.rotate(-ang);
  g.beginPath(); g.moveTo(-3, -10); g.lineTo(-12, 8); g.lineTo(12, 8); g.lineTo(3, -10); g.closePath(); g.stroke();
  g.restore();
}

function drawCar(xc, slippery) {
  // end walls are the poles (white with red section, like the photo)
  g.fillStyle = '#fbfbfb'; g.fillRect(xc, CEIL, CAR_W, FLOOR - CEIL);       // far wall of the car
  // windows show the station behind
  const wins = [[xc + 28, 336, 84, 96], [xc + 128, 336, 84, 96], [xc + 228, 336, 84, 96]];
  drawStation(wins);
  g.save(); g.strokeStyle = '#9aa3ad'; g.lineWidth = 3;
  wins.forEach(r => g.strokeRect(...r)); g.restore();
  // roof / ceiling
  const grd = g.createLinearGradient(0, ROOF, 0, CEIL);
  grd.addColorStop(0, '#c9ced4'); grd.addColorStop(1, '#eceef0');
  g.fillStyle = grd; g.fillRect(xc - 4, ROOF, CAR_W + 8, CEIL - ROOF);
  // floor + undercarriage + wheels
  g.fillStyle = slippery ? '#a9d8f0' : '#6b6b6b'; g.fillRect(xc - 4, FLOOR, CAR_W + 8, 14);
  if (slippery) { g.fillStyle = 'rgba(255,255,255,0.7)'; for (let x = xc + 20; x < xc + CAR_W - 20; x += 46) g.fillRect(x, FLOOR + 3, 22, 3); }
  g.fillStyle = '#3d3d3d'; g.fillRect(xc - 4, FLOOR + 14, CAR_W + 8, UNDER - FLOOR - 14);
  g.fillStyle = '#222';
  for (const wx of [44, 82, 258, 296]) { g.beginPath(); g.arc(xc + wx, RAIL - 13, 13, 0, 2 * Math.PI); g.fill(); }
  g.fillStyle = '#888';
  for (const wx of [44, 82, 258, 296]) { g.beginPath(); g.arc(xc + wx, RAIL - 13, 4, 0, 2 * Math.PI); g.fill(); }
  // overhead bar
  g.fillStyle = '#f2f2f2'; g.strokeStyle = '#888'; g.lineWidth = 1.5;
  g.fillRect(xc + WALL, CEIL + 4, CAR_W - 2 * WALL, 7); g.strokeRect(xc + WALL, CEIL + 4, CAR_W - 2 * WALL, 7);
  // end poles
  for (const ex of [xc, xc + CAR_W - WALL]) {
    g.fillStyle = '#fafafa'; g.strokeStyle = '#777'; g.lineWidth = 1.5;
    g.fillRect(ex, CEIL, WALL, FLOOR - CEIL); g.strokeRect(ex, CEIL, WALL, FLOOR - CEIL);
    g.fillStyle = '#c0262d'; g.fillRect(ex + 2, 360, WALL - 4, 150);
  }
}

function drawYou(x, holding, hand) {            // x = your center (stage px), facing right (forward)
  const SKIN = '#f1c19d', SKIN_D = '#c98f68', DRESS = '#1f4fa0', HAIR = '#1b1b1b';
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  // legs + shoes
  g.strokeStyle = SKIN; g.lineWidth = 8;
  g.beginPath(); g.moveTo(x - 6, 500); g.lineTo(x - 9, 552); g.moveTo(x + 6, 500); g.lineTo(x + 7, 552); g.stroke();
  g.fillStyle = '#1d3f8a';
  g.beginPath(); g.ellipse(x - 6, 555, 11, 5, 0, 0, 2 * Math.PI); g.ellipse(x + 11, 555, 11, 5, 0, 0, 2 * Math.PI); g.fill();
  // back arm (down, by your side)
  g.strokeStyle = SKIN_D; g.lineWidth = 7;
  g.beginPath(); g.moveTo(x - 8, 424); g.lineTo(x - 12, 462); g.lineTo(x - 8, 492); g.stroke();
  // dress
  g.fillStyle = DRESS;
  g.beginPath(); g.moveTo(x - 13, 418); g.lineTo(x + 13, 418); g.lineTo(x + HALF, 508); g.lineTo(x - HALF, 508); g.closePath(); g.fill();
  // neck + head + hair
  g.fillStyle = SKIN; g.fillRect(x - 4, 406, 8, 14);
  g.beginPath(); g.arc(x + 2, 396, 14, 0, 2 * Math.PI); g.fill();
  g.fillStyle = HAIR;
  g.beginPath(); g.arc(x, 393, 15, Math.PI * 0.55, Math.PI * 1.75); g.lineTo(x + 4, 384); g.closePath(); g.fill();
  g.fillRect(x - 15, 393, 9, 24);
  g.fillStyle = '#222'; g.beginPath(); g.arc(x + 10, 395, 1.8, 0, 2 * Math.PI); g.fill();      // eye
  // front arm: up to the strap, or down
  g.strokeStyle = SKIN; g.lineWidth = 7;
  g.beginPath(); g.moveTo(x + 6, 424);
  if (holding) { g.lineTo(x + 16, 392); g.lineTo(hand.x, hand.y); }
  else { g.lineTo(x + 10, 462); g.lineTo(x + 16, 490); }
  g.stroke();
  g.restore();
}

function draw() {
  const dpr = devicePixelRatio || 1;
  g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  g.clearRect(0, 0, SW, SH);

  const moving = build > 0;
  const shift = moving ? 0.5 * ACC * t * t : 0;         // how far the car has moved
  const xc = CAR0 + shift;
  const youX = CAR0 + YOU0 + (build === 2 ? shift : 0);  // build 1: nothing pushes you, you stay put
  const holding = build !== 1;
  const tilt = moving ? 13 * Math.min(1, t / 0.35) : 0;  // free straps hang tilted back while accelerating

  g.save();
  g.beginPath(); g.rect(VIEW.x, VIEW.y, VIEW.w, VIEW.h); g.clip();
  drawStation(); drawGround();
  // ground marker under where you started
  g.fillStyle = '#f08a00';
  g.beginPath(); g.moveTo(CAR0 + YOU0, RAIL + 12); g.lineTo(CAR0 + YOU0 - 9, RAIL + 30); g.lineTo(CAR0 + YOU0 + 9, RAIL + 30); g.closePath(); g.fill();
  drawCar(xc, build === 1);
  const hand = {x: xc + STRAPS[HELD] - 8, y: CEIL + 66};
  STRAPS.forEach((sx, i) => drawStrap(xc + sx, tilt, holding && i === HELD ? hand : null));
  drawYou(youX, holding, hand);
  g.restore();
  g.strokeStyle = '#9a9a9a'; g.lineWidth = 1.5; g.strokeRect(VIEW.x, VIEW.y, VIEW.w, VIEW.h);

  if (moving) {
    const ax = xc + 190, ay = 238;
    arrow(ax, ay, ax + 80, ay, RED, 9);
    label('acceleration', ax - 12, ay, '#000', 28, -1, 0);
  }
  if (build === 2) {
    const fF = `italic 700 34px "Times New Roman", Times, serif`;
    arrow(hand.x + 6, hand.y + 8, hand.x + 62, hand.y + 8, GREEN, 6);
    label('F', hand.x + 38, hand.y + 36, GREEN, 34, 0, 0, 1, fF);
    arrow(youX + 22, FLOOR - 2, youX + 92, FLOOR - 2, GREEN, 6);
    label('F', youX + 60, FLOOR - 28, GREEN, 34, 0, 0, 1, fF);
  }
}

// ---------- Loop & input ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); draw();
  requestAnimationFrame(loop);
}
function next() { if (build === LAST_BUILD) { if (NEXT) location.href = NEXT; } else enter(build + 1); }
function back() { if (build === 0) location.href = PREV + '#build=last'; else enter(build - 1); }
// touch: swipe left = next, swipe right = back (tap = next via click)
let tX0 = null, tY0 = null;
addEventListener('touchstart', e => { tX0 = e.touches[0].clientX; tY0 = e.touches[0].clientY; }, {passive: true});
addEventListener('touchend', e => {
  if (tX0 == null) return;
  const dx = e.changedTouches[0].clientX - tX0, dy = e.changedTouches[0].clientY - tY0; tX0 = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); (dx < 0 ? next : back)(); }
});
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', 'ArrowDown', 'Enter', 'n'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace', 'p'].includes(e.key)) { e.preventDefault(); back(); }
  else if (e.key === ' ') { e.preventDefault(); paused = !paused; }
  else if (e.key === 'r' || e.key === 'R') enter(build);
  showHint();
});
addEventListener('click', next);
addEventListener('contextmenu', e => { e.preventDefault(); back(); });
const hint = document.getElementById('hint'); let hintT;
function showHint() { hint.style.opacity = 1; clearTimeout(hintT); hintT = setTimeout(() => hint.style.opacity = 0, 2500); }
addEventListener('mousemove', showHint);
addEventListener('resize', layout);

// #build=N&t=T jumps to a build and fast-forwards; #build=last shows the finished last build
const h = new URLSearchParams(location.hash.slice(1));
layout();
if (h.get('build') === 'last') { enter(LAST_BUILD); while (running) step(1 / 240); }
else {
  enter(+(h.get('build') || 0));
  if (h.has('t')) for (let i = 0; i < +h.get('t') * 240; i++) step(1 / 240);
}
showHint();
setTimeout(() => document.body.classList.remove('notrans'), 300);   // no fade-in when the slide first opens
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
